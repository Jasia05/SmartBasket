<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Products - SmartBasket Admin</title>

    <link
        rel="stylesheet"
        href="admin.css"
    >

</head>


<body>


<div class="admin-layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="sidebar-logo">

            🛒 SmartBasket

            <span>
                Admin Panel
            </span>

        </div>


        <nav class="sidebar-menu">

            <a href="dashboard.html">
                📊 Dashboard
            </a>


            <a
                href="products.html"
                class="active"
            >
                🛍️ Products
            </a>


            <a href="add-product.html">
                ➕ Add Product
            </a>


            <a href="#">
                📦 Orders
            </a>


            <a href="#">
                👥 Users
            </a>

        </nav>


        <button
            class="logout-btn"
            onclick="logout()"
        >
            🚪 Logout
        </button>

    </aside>



    <!-- MAIN -->

    <main class="main-content">


        <div class="topbar">

            <div>

                <h1>
                    Products
                </h1>

                <p>
                    Manage your grocery products
                </p>

            </div>


            <div class="admin-info">

                👤
                <span id="adminEmail">
                    Admin
                </span>

            </div>

        </div>



        <div class="content-card">


            <div class="content-header">

                <h2>
                    All Products
                </h2>


                <a
                    href="add-product.html"
                    class="btn btn-primary"
                >
                    + Add Product
                </a>

            </div>



            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Image
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Category
                            </th>

                            <th>
                                Price
                            </th>

                            <th>
                                Stock
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody
                        id="productTableBody"
                    >

                        <tr>

                            <td colspan="6">
                                Loading products...
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>


        </div>


    </main>

</div>


<script src="admin.js"></script>

</body>

</html>
