<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartBasket — Fresh Groceries, Delivered</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700;9..144,900&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #1F3D2B;
    --forest-dark: #16291D;
    --cream: #F0EAD6;
    --paper: #FAF6EA;
    --gold: #D4A017;
    --tomato: #C1442D;
    --sage: #8FA88C;
    --charcoal: #2B2B26;
  }

  * { box-sizing: border-box; }
  body { margin: 0; }

  .bushel-root {
    font-family: 'Work Sans', sans-serif;
    color: var(--charcoal);
    background: var(--cream);
    min-height: 100vh;
  }
  .bushel-display { font-family: 'Fraunces', serif; }
  .bushel-mono { font-family: 'IBM Plex Mono', monospace; }

  button { font-family: inherit; cursor: pointer; border: none; background: none; }
  input { font-family: inherit; }

  *:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .btn-primary { background: var(--forest); color: var(--cream); transition: background 0.15s ease; }
  .btn-primary:hover { background: var(--forest-dark); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-gold { background: var(--gold); color: var(--forest-dark); transition: filter 0.15s ease; }
  .btn-gold:hover { filter: brightness(1.06); }

  .paper-card { background: var(--paper); border: 1px solid rgba(31,61,43,0.14); }

  .crate-tab {
    font-family: 'IBM Plex Mono', monospace;
    border: 2px dashed var(--sage);
    color: var(--forest);
    background: var(--paper);
    white-space: nowrap;
    padding: 6px 16px;
    border-radius: 999px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    flex-shrink: 0;
    transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
  }
  .crate-tab.active { background: var(--gold); border-color: var(--forest-dark); border-style: solid; color: var(--forest-dark); }

  .product-image-wrap { position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden; background: var(--cream); margin-bottom: 12px; }
  .product-image-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.2s ease; }
  .product-card:hover .product-image-wrap img { transform: scale(1.04); }
  .product-brand { font-size: 11px; color: var(--sage); margin: 0 0 4px; font-family: 'IBM Plex Mono', monospace; }
  .stock-note { font-size: 10px; color: var(--sage); margin-top: 6px; }
  .stock-note.low { color: var(--tomato); }
  .product-card .badge-stack { position: absolute; top: 8px; left: 8px; display: flex; flex-direction: column; gap: 4px; z-index: 2; }
  .product-card { transition: transform 0.15s ease, box-shadow 0.15s ease; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; }
  .product-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(31,61,43,0.12); }

  .dotted-leader { flex: 1; border-bottom: 2px dotted rgba(31,61,43,0.35); margin: 0 6px; transform: translateY(-4px); }

  .receipt-tear {
    height: 14px;
    background:
      linear-gradient(135deg, var(--paper) 50%, transparent 50%),
      linear-gradient(45deg, var(--paper) 50%, transparent 50%);
    background-size: 14px 14px;
    background-position: 0 0, 7px 0;
    background-repeat: repeat-x;
  }

  .cart-drawer { transition: transform 0.25s ease; }

  .field-input { background: var(--paper); border: 1.5px solid rgba(31,61,43,0.25); color: var(--charcoal); border-radius: 8px; display: flex; align-items: center; padding: 0 12px; margin-top: 6px; }
  .field-input:focus-within { border-color: var(--forest); }
  .field-input input { flex: 1; background: transparent; border: none; outline: none; padding: 10px 0; font-size: 14px; }

  .badge-organic { background: rgba(31,61,43,0.1); color: var(--forest); }
  .badge-sale { background: var(--tomato); color: var(--paper); }
  .badge { font-size: 10px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 0.03em; padding: 2px 8px; border-radius: 999px; display: inline-flex; align-items: center; gap: 4px; }

  .icon-circle { width: 64px; height: 64px; border-radius: 999px; overflow: hidden; background: rgba(143,168,140,0.18); flex-shrink: 0; }
  .icon-circle img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .stepper { display: flex; align-items: center; gap: 8px; border-radius: 999px; padding: 2px; background: var(--cream); }
  .stepper button { width: 28px; height: 28px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: var(--forest); }
  .stepper span { font-family: 'IBM Plex Mono', monospace; font-size: 14px; width: 16px; text-align: center; }

  .add-btn { background: var(--forest); color: var(--cream); width: 32px; height: 32px; border-radius: 999px; display: flex; align-items: center; justify-content: center; }

  /* ---------- Layout ---------- */
  .container { max-width: 1152px; margin: 0 auto; padding: 0 16px; }

  header.app-header { position: sticky; top: 0; z-index: 20; background: var(--forest); padding: 12px 16px; }
  .header-inner { display: flex; align-items: center; gap: 16px; max-width: 1152px; margin: 0 auto; }
  .logo { display: flex; align-items: center; gap: 8px; flex-shrink: 0; color: var(--cream); }
  .logo span { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600; }

  .search-wrap { flex: 1; display: flex; align-items: center; background: rgba(240,234,214,0.12); border-radius: 999px; padding: 0 12px; }
  .search-wrap svg { opacity: 0.7; flex-shrink: 0; }
  .search-wrap input { flex: 1; background: transparent; border: none; outline: none; color: var(--cream); padding: 8px 8px; font-size: 14px; }
  .search-wrap input::placeholder { color: rgba(240,234,214,0.7); }

  .header-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .user-chip { display: none; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--cream); opacity: 0.85; }
  @media (min-width: 640px) { .user-chip { display: flex; } }
  .icon-btn { padding: 8px; border-radius: 999px; color: var(--cream); display: flex; }
  .cart-btn { position: relative; padding: 8px; border-radius: 999px; background: var(--gold); display: flex; }
  .cart-count { position: absolute; top: -4px; right: -4px; width: 20px; height: 20px; border-radius: 999px; background: var(--tomato); color: var(--paper); font-size: 10px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; display: flex; align-items: center; justify-content: center; }

  .category-row { display: flex; gap: 8px; overflow-x: auto; padding: 20px 0 8px; }

  main.shop-main { padding: 24px 0 48px; }
  .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (min-width: 640px) { .product-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 1024px) { .product-grid { grid-template-columns: repeat(4, 1fr); } }

  .empty-state { text-align: center; padding: 80px 0; }
  .empty-state h3 { font-family: 'Fraunces', serif; font-size: 20px; color: var(--forest); margin: 0 0 4px; }
  .empty-state p { font-size: 14px; color: var(--sage); margin: 0; }

  /* ---------- Cart drawer ---------- */
  .drawer-backdrop { position: fixed; inset: 0; z-index: 30; background: rgba(22,41,29,0.4); opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }

  .cart-drawer { position: fixed; top: 0; right: 0; height: 100%; width: 100%; z-index: 40; transform: translateX(100%); }
  @media (min-width: 640px) { .cart-drawer { width: 384px; } }
  .cart-drawer.open { transform: translateX(0); }
  .drawer-inner { background: var(--paper); height: 100%; display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,0.15); }
  .drawer-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px dashed var(--sage); }
  .drawer-header h2 { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; color: var(--forest); margin: 0; }

  .drawer-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .cart-line { margin-bottom: 16px; display: flex; gap: 10px; }
  .cart-line-img { width: 40px; height: 40px; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: var(--cream); }
  .cart-line-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cart-line-content { flex: 1; min-width: 0; }
  .cart-line-top { display: flex; align-items: baseline; font-family: 'IBM Plex Mono', monospace; font-size: 14px; }
  .cart-line-top span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cart-line-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .remove-btn { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--tomato); }

  .drawer-footer { padding: 16px 20px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; background: var(--paper); }
  .row { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .row.muted { color: var(--sage); margin-bottom: 12px; }
  .row.total { font-size: 16px; font-weight: 600; color: var(--forest); border-top: 1px dashed var(--sage); padding-top: 10px; margin-bottom: 16px; }
  .checkout-btn { width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; }

  .confirm-view { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 24px; text-align: center; }
  .confirm-circle { width: 64px; height: 64px; border-radius: 999px; background: var(--forest); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .confirm-view .order-num { font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--sage); }
  .confirm-view h3 { font-family: 'Fraunces', serif; font-size: 20px; color: var(--forest); margin: 8px 0; }
  .confirm-view p { font-size: 14px; margin: 0 0 24px; }
  .empty-cart { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 24px; text-align: center; color: var(--sage); }
  .empty-cart svg { margin-bottom: 12px; }

  /* ---------- Auth ---------- */
  .auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 16px; }
  .auth-wrap { width: 100%; max-width: 384px; }
  .auth-logo { display: flex; flex-direction: column; align-items: center; margin-bottom: 24px; }
  .auth-logo-circle { width: 56px; height: 56px; border-radius: 999px; background: var(--forest); display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
  .auth-logo h1 { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 600; color: var(--forest); margin: 0; }
  .auth-logo p { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.03em; color: var(--sage); margin: 4px 0 0; }

  .auth-card { border-radius: 16px; padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  .auth-toggle { display: flex; margin-bottom: 24px; border-radius: 999px; padding: 4px; background: var(--cream); }
  .auth-toggle button { flex: 1; padding: 8px; border-radius: 999px; font-size: 14px; font-weight: 500; font-family: 'IBM Plex Mono', monospace; color: var(--forest); }
  .auth-toggle button.active { background: var(--forest); color: var(--cream); }

  .field-label { font-family: 'IBM Plex Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--forest); }
  .field-group { margin-bottom: 16px; }

  .auth-error { font-size: 14px; margin-bottom: 16px; border-radius: 8px; padding: 8px 12px; background: rgba(193,68,45,0.1); color: var(--tomato); }
  .auth-submit { width: 100%; padding: 12px; border-radius: 8px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 8px; }
  .auth-demo { font-family: 'IBM Plex Mono', monospace; font-size: 12px; margin-top: 16px; text-align: center; color: var(--sage); }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="app" class="bushel-root"></div>

<script>

function icon(name, size = 16, color = "currentColor") {
  return (ICONS[name] || "").replaceAll("{s}", size).replaceAll("{c}", color);
}

// ---------- Currency ----------
function taka(amount) {
  return "৳" + Math.round(amount).toLocaleString("en-IN");
}

const CATEGORIES = ["All", "Fresh Produce", "Rice & Staples", "Cooking Essentials", "Dairy & Eggs", "Meat & Fish", "Snacks & Biscuits", "Beverages", "Bakery", "Household", "Personal Care"];
const DELIVERY_FEE = 60;

// ---------- App state ----------
const state = {
  users: [{ name: "Demo Shopper", email: "demo@smartbasket.com", password: "demo1234" }],
  currentUser: null,
  authMode: "login",
  authError: "",
  showPassword: false,
  activeCategory: "All",
  search: "",
  cart: {},       // { productId: qty }
  cartOpen: false,
  orderPlaced: false,
  orderNumber: null,
};

const root = document.getElementById("app");

function render() {
  root.innerHTML = state.currentUser ? renderShop() : renderAuth();
  attachEvents();
}

// ---------- Auth screen ----------
function renderAuth() {
  const isLogin = state.authMode === "login";
  return `
    <div class="auth-screen">
      <div class="auth-wrap">
        <div class="auth-logo">
          <div class="auth-logo-circle">${icon("basket", 26, "var(--cream)")}</div>
          <h1>SmartBasket</h1>
          <p>fresh groceries, delivered</p>
        </div>

        <div class="auth-card paper-card">
          <div class="auth-toggle">
            <button data-action="set-mode" data-mode="login" class="${isLogin ? "active" : ""}">Log in</button>
            <button data-action="set-mode" data-mode="register" class="${!isLogin ? "active" : ""}">Register</button>
          </div>

          <form id="auth-form">
            ${!isLogin ? `
            <div class="field-group">
              <label class="field-label">Full name</label>
              <div class="field-input">
                ${icon("user", 16, "var(--sage)")}
                <input id="f-name" type="text" placeholder="Jane Appleseed" />
              </div>
            </div>` : ""}

            <div class="field-group">
              <label class="field-label">Email</label>
              <div class="field-input">
                ${icon("mail", 16, "var(--sage)")}
                <input id="f-email" type="email" placeholder="you@example.com" />
              </div>
            </div>

            <div class="field-group">
              <label class="field-label">Password</label>
              <div class="field-input">
                ${icon("lock", 16, "var(--sage)")}
                <input id="f-password" type="${state.showPassword ? "text" : "password"}" placeholder="••••••••" />
                <button type="button" data-action="toggle-pw" aria-label="Toggle password visibility">
                  ${icon(state.showPassword ? "eyeOff" : "eye", 16, "var(--sage)")}
                </button>
              </div>
            </div>

            ${state.authError ? `<p class="auth-error">${escapeHtml(state.authError)}</p>` : ""}

            <button type="submit" class="btn-primary auth-submit">
              ${isLogin ? "Log in" : "Create account"} ${icon("arrowRight", 16, "var(--cream)")}
            </button>
          </form>

          ${isLogin ? `<p class="auth-demo">demo@smartbasket.com / demo1234</p>` : ""}
        </div>
      </div>
    </div>
  `;
}

// ---------- Shop screen ----------
function getCartItems() {
  return Object.entries(state.cart)
    .map(([id, qty]) => ({ product: PRODUCTS.find((p) => p.id === Number(id)), qty }))
    .filter((i) => i.product);
}

function renderProductCard(p) {
  const qty = state.cart[p.id] || 0;
  return `
    <div class="product-card paper-card">
      <div class="product-image-wrap">
        <img src="${p.img}" alt="${escapeHtml(p.name)}" loading="lazy"
             onerror="this.onerror=null;this.src='https://placehold.co/500x500/F0EAD6/1F3D2B?text=Product+Image';" />
        <div class="badge-stack">
          ${p.sale ? `<span class="badge badge-sale">Sale</span>` : ""}
          ${p.popular ? `<span class="badge badge-organic">Popular</span>` : ""}
        </div>
      </div>
      <p class="product-brand">${escapeHtml(p.brand || "SmartBasket")}</p>
      <h3 class="bushel-display" style="font-size:16px;font-weight:500;color:var(--forest);margin:0 0 2px;line-height:1.3;">${escapeHtml(p.name)}</h3>
      <p class="bushel-mono" style="font-size:12px;color:var(--sage);margin:0 0 8px;">${escapeHtml(p.unit)}</p>
      <div style="margin-top:auto;display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:baseline;gap:8px;">
          <span class="bushel-mono" style="font-size:18px;font-weight:600;">${taka(p.price)}</span>
          ${p.sale ? `<span class="bushel-mono" style="font-size:12px;color:var(--sage);text-decoration:line-through;">${taka(p.originalPrice)}</span>` : ""}
        </div>
        ${p.stock <= 10 ? `<span class="stock-note low">Only ${p.stock} left</span>` : ""}
        ${qty > 0 ? `
          <div class="stepper">
            <button data-action="dec" data-id="${p.id}" aria-label="Decrease">${icon("minus", 14, "var(--forest)")}</button>
            <span>${qty}</span>
            <button data-action="inc" data-id="${p.id}" aria-label="Increase">${icon("plus", 14, "var(--forest)")}</button>
          </div>
        ` : `
          <button class="add-btn" data-action="add" data-id="${p.id}" aria-label="Add to cart">${icon("plus", 16, "var(--cream)")}</button>
        `}
      </div>
    </div>
  `;
}

function renderCartDrawer() {
  const items = getCartItems();
  const subtotal = items.reduce((sum, i) => sum + i.qty * i.product.price, 0);
  const deliveryFee = subtotal > 0 ? DELIVERY_FEE : 0;
  const total = subtotal + deliveryFee;

  let body;
  if (state.orderPlaced) {
    body = `
      <div class="confirm-view">
        <div class="confirm-circle">${icon("check", 28, "var(--cream)")}</div>
        <p class="order-num bushel-mono">Order #${state.orderNumber}</p>
        <h3>Thanks for shopping with SmartBasket</h3>
        <p>Your groceries are being packed and will be on their way shortly.</p>
        <button class="btn-primary" data-action="continue-shopping" style="padding:10px 20px;border-radius:8px;font-weight:500;">Continue shopping</button>
      </div>
    `;
  } else if (items.length === 0) {
    body = `
      <div class="empty-cart">
        ${icon("basket", 36, "var(--sage)")}
        <p>Your basket is empty. Add something fresh.</p>
      </div>
    `;
  } else {
    body = `
      <div class="drawer-body">
        ${items.map(({ product, qty }) => `
          <div class="cart-line">
            <div class="cart-line-img"><img src="${product.img}" alt="${escapeHtml(product.name)}" loading="lazy" /></div>
            <div class="cart-line-content">
              <div class="cart-line-top">
                <span>${escapeHtml(product.name)}</span>
                <span class="dotted-leader"></span>
                <span>${taka(product.price * qty)}</span>
              </div>
              <div class="cart-line-bottom">
                <div class="stepper">
                  <button data-action="dec" data-id="${product.id}" aria-label="Decrease">${icon("minus", 12, "var(--forest)")}</button>
                  <span style="font-size:12px;">${qty}</span>
                  <button data-action="inc" data-id="${product.id}" aria-label="Increase">${icon("plus", 12, "var(--forest)")}</button>
                </div>
                <button class="remove-btn" data-action="remove" data-id="${product.id}">${icon("trash", 12, "var(--tomato)")} Remove</button>
              </div>
            </div>
          </div>
        `).join("")}
      </div>
      <div class="receipt-tear"></div>
      <div class="drawer-footer">
        <div class="row"><span>Subtotal</span><span>${taka(subtotal)}</span></div>
        <div class="row muted"><span>Delivery</span><span>${taka(deliveryFee)}</span></div>
        <div class="row total"><span>Total</span><span>${taka(total)}</span></div>
        <button class="btn-gold checkout-btn" data-action="checkout">Complete order</button>
      </div>
    `;
  }

  return `
    <div class="drawer-backdrop ${state.cartOpen ? "open" : ""}" data-action="close-cart"></div>
    <aside class="cart-drawer ${state.cartOpen ? "open" : ""}">
      <div class="drawer-inner paper-card">
        <div class="drawer-header">
          <h2>${state.orderPlaced ? "Order confirmed" : "Your basket"}</h2>
          <button data-action="close-cart" aria-label="Close cart">${icon("x", 20, "var(--forest)")}</button>
        </div>
        ${body}
      </div>
    </aside>
  `;
}

function renderShop() {
  const filtered = PRODUCTS.filter((p) => {
    const matchesCategory = state.activeCategory === "All" || p.category === state.activeCategory;
    const matchesSearch = p.name.toLowerCase().includes(state.search.toLowerCase());
    return matchesCategory && matchesSearch;
  });
  const itemCount = getCartItems().reduce((sum, i) => sum + i.qty, 0);

  return `
    <header class="app-header">
      <div class="header-inner">
        <div class="logo">${icon("basket", 22, "var(--cream)")}<span class="bushel-display">SmartBasket</span></div>
        <div class="search-wrap">
          ${icon("search", 16, "var(--cream)")}
          <input id="search-input" type="text" placeholder="Search groceries..." value="${escapeHtml(state.search)}" />
        </div>
        <div class="header-actions">
          <span class="user-chip">${icon("user", 14, "var(--cream)")} ${escapeHtml(state.currentUser.name.split(" ")[0])}</span>
          <button class="icon-btn" data-action="logout" aria-label="Log out">${icon("logout", 18, "var(--cream)")}</button>
          <button class="cart-btn" data-action="open-cart" aria-label="Open cart">
            ${icon("basket", 18, "var(--forest-dark)")}
            ${itemCount > 0 ? `<span class="cart-count">${itemCount}</span>` : ""}
          </button>
        </div>
      </div>
    </header>

    <div class="container">
      <div class="category-row">
        ${CATEGORIES.map((cat, i) => `
          <button class="crate-tab ${state.activeCategory === cat ? "active" : ""}"
                  data-action="set-category" data-cat="${escapeHtml(cat)}"
                  style="transform:rotate(${i % 2 === 0 ? "-1deg" : "1deg"});">
            ${escapeHtml(cat)}
          </button>
        `).join("")}
      </div>
    </div>

    <main class="shop-main">
      <div class="container">
        ${filtered.length === 0 ? `
          <div class="empty-state">
            <h3>Nothing matches "${escapeHtml(state.search)}"</h3>
            <p>Try another search or browse a different category.</p>
          </div>
        ` : `
          <div class="product-grid">
            ${filtered.map(renderProductCard).join("")}
          </div>
        `}
      </div>
    </main>

    ${renderCartDrawer()}
  `;
}

// ---------- Helpers ----------
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---------- Actions ----------
function login(email, password) {
  const found = state.users.find((u) => u.email === email && u.password === password);
  if (!found) {
    state.authError = "We couldn't find an account with that email and password.";
    render();
    return;
  }
  state.authError = "";
  state.currentUser = found;
  render();
}

function register(name, email, password) {
  if (!name || !email || !password) {
    state.authError = "Please fill in your name, email, and password.";
    render();
    return;
  }
  if (state.users.some((u) => u.email === email)) {
    state.authError = "An account with that email already exists.";
    render();
    return;
  }
  const newUser = { name, email, password };
  state.users.push(newUser);
  state.authError = "";
  state.currentUser = newUser;
  render();
}

function logout() {
  state.currentUser = null;
  state.cart = {};
  state.cartOpen = false;
  state.orderPlaced = false;
  state.authMode = "login";
  render();
}

function addToCart(id) { state.cart[id] = 1; render(); }
function incQty(id) { state.cart[id] = (state.cart[id] || 0) + 1; render(); }
function decQty(id) {
  const q = (state.cart[id] || 0) - 1;
  if (q <= 0) delete state.cart[id];
  else state.cart[id] = q;
  render();
}
function removeItem(id) { delete state.cart[id]; render(); }

function checkout() {
  if (getCartItems().length === 0) return;
  state.orderNumber = Math.floor(1000 + Math.random() * 9000);
  state.orderPlaced = true;
  render();
}
function continueShopping() {
  state.cart = {};
  state.orderPlaced = false;
  state.cartOpen = false;
  render();
}

// ---------- Event wiring (delegated, re-attached after each render) ----------
function attachEvents() {
  root.querySelectorAll("[data-action]").forEach((el) => {
    const action = el.getAttribute("data-action");
    const id = el.getAttribute("data-id") ? Number(el.getAttribute("data-id")) : null;

    switch (action) {
      case "set-mode":
        el.addEventListener("click", () => { state.authMode = el.getAttribute("data-mode"); state.authError = ""; render(); });
        break;
      case "toggle-pw":
        el.addEventListener("click", () => { state.showPassword = !state.showPassword; render(); });
        break;
      case "set-category":
        el.addEventListener("click", () => { state.activeCategory = el.getAttribute("data-cat"); render(); });
        break;
      case "add": el.addEventListener("click", () => addToCart(id)); break;
      case "inc": el.addEventListener("click", () => incQty(id)); break;
      case "dec": el.addEventListener("click", () => decQty(id)); break;
      case "remove": el.addEventListener("click", () => removeItem(id)); break;
      case "open-cart": el.addEventListener("click", () => { state.cartOpen = true; render(); }); break;
      case "close-cart": el.addEventListener("click", () => { state.cartOpen = false; render(); }); break;
      case "checkout": el.addEventListener("click", checkout); break;
      case "continue-shopping": el.addEventListener("click", continueShopping); break;
      case "logout": el.addEventListener("click", logout); break;
    }
  });

  const searchInput = document.getElementById("search-input");
  if (searchInput) {
    searchInput.addEventListener("input", (e) => {
      state.search = e.target.value;
      const caret = e.target.selectionStart;
      render();
      const newInput = document.getElementById("search-input");
      if (newInput) { newInput.focus(); newInput.setSelectionRange(caret, caret); }
    });
  }
  const authForm = document.getElementById("auth-form");
  if (authForm) {
    authForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("f-email").value.trim();
      const password = document.getElementById("f-password").value;
      if (state.authMode === "login") {
        login(email, password);
      } else {
        const name = document.getElementById("f-name").value.trim();
        register(name, email, password);
      }
    });
  }
}

render();
</script>
